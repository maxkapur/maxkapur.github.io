{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Pages }}
    <article class="section-item">
      <details>
        <summary>
          <header class="article-header">
            <h1>
              <a href="{{ .RelPermalink }}">
                {{- .LinkTitle -}}
              </a>
            </h1>
          </header>
        </summary>
        <div class="article-content">
          {{ .Summary }}
        </div>
      </details>
    </article>
  {{ end }}
{{ end }}
