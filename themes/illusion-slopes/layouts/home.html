{{ define "main" }}
  <div class="layout-spacing">
    <header>
      {{ .Content }}
    </header>
    {{ range site.RegularPages.ByDate.Reverse }}
      <section>
        <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        {{ .Summary }}
      </section>
    {{ end }}
  </div>
{{ end }}
