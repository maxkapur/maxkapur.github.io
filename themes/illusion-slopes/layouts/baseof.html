<!doctype html>
<html
  lang="{{ site.Language.Locale }}"
  dir="{{ or site.Language.Direction `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="body-wrapper">
      <header class="body-header">{{ partial "header.html" . }}</header>
      <main>{{ block "main" . }}{{ end }}</main>
      <footer class="body-footer">{{ partial "footer.html" . }}</footer>
    </div>
  </body>
</html>
