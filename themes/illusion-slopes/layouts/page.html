{{ define "main" }}
  <article class="page-item">
    <header class="article-header">
      <h1>
        <a class="subtle" href="{{ .RelPermalink }}">
          {{- .Title -}}
        </a>
      </h1>
      <p class="subtitle">
        {{- partial "time.html" . -}}
      </p>
    </header>
    <div class="article-content">
      {{ .Content }}
      {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
    </div>
  </article>
{{ end }}
